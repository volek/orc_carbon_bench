plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

group = 'ru.sber.orcbench'
version = '0.1.0-SNAPSHOT'

subprojects {
    apply plugin: 'java'
    apply plugin: 'application'
    apply plugin: 'com.github.johnrengelman.shadow'

    group = rootProject.group
    version = rootProject.version

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(8)
        }
    }

    sourceSets {
        main {
            java.srcDirs = ["${rootDir}/src/main/java"]
        }
        test {
            java.srcDirs = ["${rootDir}/src/test/java"]
        }
    }

    application {
        mainClass = 'ru.sber.orcbench.AppMain'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    jar {
        manifest {
            attributes 'Main-Class': 'ru.sber.orcbench.AppMain'
        }
    }

    tasks.test {
        useJUnitPlatform()
    }

    tasks.register('copyToRootLibs', Copy) {
        dependsOn tasks.named('shadowJar')
        from tasks.named('shadowJar')
        into "${rootDir}/build/libs"
    }

    tasks.named('shadowJar') {
        finalizedBy tasks.named('copyToRootLibs')
    }

    tasks.named('build') {
        dependsOn tasks.named('shadowJar')
    }
}

def spark31ArchiveName = 'spark-3.1.1-bin-without-hadoop.tgz'
def spark31ArchiveUrl = 'https://archive.apache.org/dist/spark/spark-3.1.1/spark-3.1.1-bin-without-hadoop.tgz'
def spark31ArchiveFile = rootProject.file("dist/${spark31ArchiveName}")
def spark31DistDir = rootProject.file('dist')
def spark31PartPrefix = "${spark31ArchiveName}.part-"

tasks.register('downloadSpark31') {
    group = 'build'
    description = 'Downloads Apache Spark 3.1.1 without-hadoop archive into dist/ (skipped if already present).'
    outputs.file spark31ArchiveFile
    outputs.upToDateWhen { spark31ArchiveFile.exists() && spark31ArchiveFile.length() > 0 }
    doLast {
        if (spark31ArchiveFile.exists() && spark31ArchiveFile.length() > 0) {
            logger.lifecycle("Spark 3.1.1 archive already present: ${spark31ArchiveFile}")
            return
        }
        spark31ArchiveFile.parentFile.mkdirs()
        logger.lifecycle("Downloading ${spark31ArchiveUrl}")
        spark31ArchiveFile.withOutputStream { os ->
            new URI(spark31ArchiveUrl).toURL().openStream().withStream { is ->
                os << is
            }
        }
        logger.lifecycle("Saved ${spark31ArchiveFile} (${spark31ArchiveFile.length()} bytes)")
    }
}

tasks.register('splitSpark31Archive') {
    group = 'build'
    description = 'Splits Spark 3.1.1 archive into 90MB chunks for GitHub (100MB file limit).'
    dependsOn tasks.named('downloadSpark31')
    doLast {
        def parts = spark31DistDir.listFiles()?.findAll { it.name.startsWith(spark31PartPrefix) } ?: []
        if (!parts.isEmpty()) {
            logger.lifecycle("Spark 3.1.1 parts already present in ${spark31DistDir}")
            return
        }
        if (!spark31ArchiveFile.exists()) {
            throw new GradleException("Missing ${spark31ArchiveFile}")
        }
        exec {
            commandLine 'split', '-b', '90M', '-d', '-a', '2',
                    spark31ArchiveFile.absolutePath,
                    new File(spark31DistDir, spark31PartPrefix).absolutePath
        }
        logger.lifecycle("Split ${spark31ArchiveFile.name} into ${spark31PartPrefix}*")
    }
}

tasks.register('test') {
    group = 'verification'
    description = 'Runs unit tests for both Spark runtimes.'
    dependsOn ':app-spark31:test', ':app-spark32:test'
}

tasks.register('build') {
    group = 'build'
    description = 'Builds Spark 3.1.1 and Spark 3.2 artifacts.'
    dependsOn ':app-spark31:build', ':app-spark32:build', 'splitSpark31Archive'
}

tasks.register('shadowJar') {
    group = 'build'
    description = 'Builds Spark 3.1.1 and Spark 3.2 fat JARs.'
    dependsOn ':app-spark31:shadowJar', ':app-spark32:shadowJar'
}

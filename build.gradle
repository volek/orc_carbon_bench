plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'ru.sber.orcbench'
version = '0.1.0-SNAPSHOT'

def sparkVersion = '3.2.1'
def slf4jVersion = '1.7.36'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

application {
    mainClass = 'ru.sber.orcbench.AppMain'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes 'Main-Class': 'ru.sber.orcbench.AppMain'
    }
}

dependencies {
    compileOnly "org.apache.spark:spark-sql_2.12:${sparkVersion}"
    compileOnly "org.apache.orc:orc-core:1.6.14"

    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    implementation "org.slf4j:slf4j-simple:${slf4jVersion}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "org.apache.spark:spark-sql_2.12:${sparkVersion}"
    testImplementation "org.apache.orc:orc-core:1.6.14"
}

tasks.test {
    useJUnitPlatform()
}

shadowJar {
    archiveFileName.set('orc-bench-all.jar')
    mergeServiceFiles()
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    dependencies {
        exclude(dependency('org.apache.spark:.*'))
        exclude(dependency('org.apache.hadoop:.*'))
        exclude(dependency('org.scala-lang:.*'))
        exclude(dependency('org.scala-lang.modules:.*'))
    }

    manifest {
        attributes 'Main-Class': 'ru.sber.orcbench.AppMain'
    }
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}
